name: Suggest an improvement
description: Propose a change to Fair and Square.
labels: [enhancement]
body:
  - type: textarea
    id: description
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: game_link
    attributes:
      label: Game link (optional)
      description: If this concerns a particular game state, use Share in the game's control bar and paste the full link here. It carries simulation parameters and progress to help recreate what you saw.
  - type: textarea
    id: motivation
    attributes:
      label: Motivation (optional)
      description: Why would this change help?
  - type: textarea
    id: example
    attributes:
      label: Example (optional)
      description: A concrete example, sketch or screenshot.
