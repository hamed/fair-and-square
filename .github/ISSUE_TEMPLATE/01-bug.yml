name: Report a bug
description: Tell us about something that is not working.
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: game_link
    attributes:
      label: Game link (optional)
      description: If this concerns a particular game state, use Share in the game's control bar and paste the full link here. It carries simulation parameters and progress to help recreate what you saw.
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour (optional)
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps (optional)
      description: How can we make it happen again?
  - type: input
    id: environment
    attributes:
      label: Browser and device (optional)
      placeholder: e.g. Safari on iPhone, Chrome on Windows
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot (optional)
      description: Paste or drag an image into this field.
  - type: textarea
    id: settings
    attributes:
      label: Game settings (optional)
      description: Describe any mode, model or settings details not captured by the shared link.
